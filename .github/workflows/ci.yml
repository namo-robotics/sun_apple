name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the published Apple Silicon compiler
        run: |
          test "$(uname -m)" = arm64
          brew install namo-robotics/sun/sun
      - name: Build, test, and package the bindings
        run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sun_apple-macos-arm64
          if-no-files-found: error
          path: |
            build/sun_apple-arm64-apple-darwin.tar.gz
            build/sun_apple-arm64-apple-darwin.tar.gz.sha256
            build/sun_apple-arm64-apple-darwin.moon
            build/sun_apple-arm64-apple-darwin.sun.tar.gz
  publish-macos:
    needs: macos
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sun_apple-macos-arm64
          path: build/release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          target_commitish: ${{ github.sha }}
          name: Development Build
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            build/release/sun_apple-arm64-apple-darwin.tar.gz
            build/release/sun_apple-arm64-apple-darwin.tar.gz.sha256
            build/release/sun_apple-arm64-apple-darwin.moon
            build/release/sun_apple-arm64-apple-darwin.sun.tar.gz
